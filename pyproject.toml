[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "schocken"
version = "0.1.0"
description = "Simulation und optimale Strategien für das Würfelspiel Schocken"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tqdm",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"
